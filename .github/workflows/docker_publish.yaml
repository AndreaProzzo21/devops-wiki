name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]          # es. git tag v1.2.0 && git push --tags
  pull_request:
    branches: [main]      # sulle PR si builda soltanto, senza pubblicare

# Se arriva un nuovo push sullo stesso branch, annulla la build precedente
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx permettono di costruire l'immagine ARM (Raspberry) su un runner x86
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Il login serve solo per pubblicare, non sulle PR (che non hanno accesso ai secrets)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Genera i tag automaticamente:
      #   push su main  -> latest + sha-abc1234
      #   tag v1.2.3    -> 1.2.3 + 1.2 (+ sha-abc1234)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/devops-wiki
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Il Dockerfile valida il dataset YAML durante la build: un YAML rotto fa fallire la pipeline
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Sulle PR solo amd64 (più veloce); in pubblicazione anche arm64 per il Raspberry
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max