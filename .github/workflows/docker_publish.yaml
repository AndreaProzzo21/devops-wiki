name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]          # le release (git tag v1.2.0) partono sempre: i filtri paths non valgono per i tag
    paths:                # builda solo se cambia qualcosa che finisce nell'immagine o nei test
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - app/**
      - data/**
      - static/**
      - tests/**
      - .github/workflows/docker-publish.yml
  pull_request:
    branches: [main]      # sulle PR si builda soltanto, senza pubblicare
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - app/**
      - data/**
      - static/**
      - tests/**          # <-- Aggiunto
      - .github/workflows/docker-publish.yml
  workflow_dispatch:      # pulsante "Run workflow" per rifare la build a mano

# Se arriva un nuovo push sullo stesso branch, annulla la build precedente
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- JOB 1: TEST ---
  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Test Suite
        run: python -m pytest -v tests/

  # --- JOB 2: BUILD & PUSH ---
  docker:
    name: Build and Push Docker Image
    needs: test           # <-- FONDAMENTALE: aspetta che il job "test" finisca con successo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + Buildx permettono di costruire l'immagine ARM (Raspberry) su un runner x86
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Il login serve solo per pubblicare, non sulle PR (che non hanno accesso ai secrets)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Genera i tag automaticamente:
      #   push su main  -> latest + sha-abc1234
      #   tag v1.2.3    -> 1.2.3 + 1.2 (+ sha-abc1234)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/devops-wiki
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Il Dockerfile valida il dataset YAML durante la build: un YAML rotto fa fallire la pipeline
      - name: Build and push
        id: build         # <-- NUOVO: serve per leggere il digest nello step finale
        uses: docker/build-push-action@v6
        with:
          context: .
          # Sulle PR solo amd64 (più veloce); in pubblicazione anche arm64 per il Raspberry
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Telegram
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STACK: devops-wiki
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Toglie spazi e a capo che si infilano quando si incolla un secret
          TG_TOKEN="$(printf '%s' "$TG_TOKEN" | tr -d '[:space:]')"
          TG_CHAT="$(printf '%s' "$TG_CHAT" | tr -d '[:space:]')"

          # Diagnostica senza stampare i valori
          echo "Lunghezza token: ${#TG_TOKEN} | chat id: ${#TG_CHAT}"
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "Secret Telegram mancanti"; exit 1; }

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="${REF_NAME#v}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          jq -n \
            --arg chat "$TG_CHAT" \
            --arg text "🚀 Nuova versione di $STACK disponibile
          Tag: $TAG
          Build: $RUN_URL" \
            --arg yes "d:$STACK:$TAG" \
            --arg no  "n:$STACK:$TAG" \
            '{chat_id:$chat, text:$text,
              link_preview_options:{is_disabled:true},
              reply_markup:{inline_keyboard:[[
                {text:"✅ Deploy", callback_data:$yes},
                {text:"❌ Salta",  callback_data:$no}]]}}' \
            > /tmp/tg.json

          code=$(curl -sS -o /tmp/tg_resp.json -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @/tmp/tg.json)

          echo "Telegram ha risposto HTTP $code"
          jq -r '.description // "ok"' /tmp/tg_resp.json
          [ "$code" = "200" ]