# ======================= NETWORK =======================
- id: linux-ss
  tool: linux
  category: network
  name: ss
  syntax: ss [-tulpn] [state STATE]
  summary: Shows sockets and listening ports (modern replacement for netstat)
  flags:
    - {flag: "-t / -u", description: "TCP only / UDP only"}
    - {flag: "-l", description: "Listening sockets only"}
    - {flag: "-p", description: "Shows the process (requires root)"}
    - {flag: "-n", description: "Do not resolve names, show numbers"}
  examples:
    - {cmd: "sudo ss -tulpn", description: "All listening ports with process information"}
    - {cmd: "ss -tn state established", description: "Active TCP connections"}
  keywords: [open ports, port in use, netstat, listening, socket]
  related: [linux-lsof]

- id: linux-lsof
  tool: linux
  category: network
  name: lsof
  syntax: lsof [-i :PORT] [-p PID] [+D DIR]
  summary: Lists open files and which process is using them
  flags:
    - {flag: "-i :PORT", description: "Process using a port"}
    - {flag: "-p", description: "Files opened by a PID"}
    - {flag: "+D", description: "Who is using files in a directory"}
  examples:
    - {cmd: "sudo lsof -i :8080", description: "Finds who is using port 8080"}
    - {cmd: "sudo lsof +D /var/log", description: "Processes keeping log files open"}
  keywords: [open files, who uses port, blocking process, device busy]
  related: [linux-ss]

- id: linux-ip
  tool: linux
  category: network
  name: ip
  syntax: ip [addr|link|route|neigh] [COMMAND]
  summary: Inspects and manages network interfaces, addresses, routes, and neighbors
  flags:
    - {flag: "addr", description: "Shows or manages IP addresses"}
    - {flag: "link", description: "Shows or manages network interfaces"}
    - {flag: "route", description: "Shows or manages routing tables"}
    - {flag: "neigh", description: "Shows or manages the neighbor table"}
  examples:
    - {cmd: "ip addr show", description: "Lists interfaces and IP addresses"}
    - {cmd: "ip route show", description: "Shows the routing table"}
    - {cmd: "ip neigh show", description: "Shows the ARP/NDP neighbor table"}
  keywords: [ip address, network interface, route, routing table, arp, network config]
  related: [linux-ss, linux-ping, linux-traceroute]

- id: linux-ping
  tool: linux
  category: network
  name: ping
  syntax: ping [-c COUNT] [-W TIMEOUT] HOST
  summary: Tests network reachability using ICMP
  flags:
    - {flag: "-c", description: "Number of packets to send"}
    - {flag: "-W", description: "Timeout in seconds for each reply"}
    - {flag: "-i", description: "Interval between packets"}
  examples:
    - {cmd: "ping -c 4 8.8.8.8", description: "Tests connectivity to an IP address"}
    - {cmd: "ping -c 4 example.com", description: "Tests connectivity and DNS resolution"}
  keywords: [connectivity, reachability, icmp, network test, packet loss]
  related: [linux-ip, linux-traceroute, linux-dig]

- id: linux-traceroute
  tool: linux
  category: network
  name: traceroute
  syntax: traceroute [-n] [-m MAX_TTL] HOST
  summary: Shows the network hops taken to reach a host
  flags:
    - {flag: "-n", description: "Do not resolve hostnames"}
    - {flag: "-m", description: "Maximum TTL/hop count"}
    - {flag: "-w", description: "Wait time for each response"}
  examples:
    - {cmd: "traceroute -n example.com", description: "Shows the route without DNS lookups"}
  keywords: [network path, hops, routing, latency, troubleshooting]
  related: [linux-ping, linux-mtr]

- id: linux-mtr
  tool: linux
  category: network
  name: mtr
  syntax: mtr [-r] [-c COUNT] [-n] HOST
  summary: Combines ping and traceroute for continuous path diagnostics
  flags:
    - {flag: "-r", description: "Report mode instead of interactive mode"}
    - {flag: "-c", description: "Number of cycles in report mode"}
    - {flag: "-n", description: "Do not resolve hostnames"}
  examples:
    - {cmd: "mtr -rw -c 20 example.com", description: "Generates a 20-cycle network diagnostic report"}
  keywords: [network diagnostic, packet loss, latency, route, hops]
  related: [linux-ping, linux-traceroute]

- id: linux-dig
  tool: linux
  category: network
  name: dig
  syntax: dig [@SERVER] NAME [TYPE]
  summary: Queries DNS records directly
  flags:
    - {flag: "@SERVER", description: "Use a specific DNS server"}
    - {flag: "+short", description: "Show only the concise answer"}
    - {flag: "+trace", description: "Trace DNS delegation from the root"}
    - {flag: "TYPE", description: "Record type such as A, AAAA, MX, NS, TXT"}
  examples:
    - {cmd: "dig +short example.com A", description: "Gets the IPv4 address"}
    - {cmd: "dig @1.1.1.1 example.com", description: "Queries Cloudflare DNS directly"}
    - {cmd: "dig example.com MX", description: "Shows mail exchange records"}
  keywords: [dns, dns lookup, records, mx, txt, nameserver]
  related: [linux-ping, linux-curl, linux-host]

- id: linux-curl
  tool: linux
  category: network
  name: curl
  syntax: curl [OPTIONS] URL
  summary: Transfers data over HTTP, HTTPS, and many other protocols
  flags:
    - {flag: "-I, --head", description: "Fetch headers only"}
    - {flag: "-s, --silent", description: "Suppress progress and non-error output"}
    - {flag: "-S, --show-error", description: "Show errors when used with --silent"}
    - {flag: "-f, --fail", description: "Fail on HTTP errors"}
    - {flag: "-L, --location", description: "Follow redirects"}
    - {flag: "-o FILE", description: "Write output to a file"}
    - {flag: "-H", description: "Add an HTTP header"}
    - {flag: "-d, --data", description: "Send request data"}
  examples:
    - {cmd: "curl -fsS https://example.com/health", description: "Checks an HTTP endpoint and fails on HTTP errors"}
    - {cmd: "curl -I https://example.com", description: "Inspects response headers"}
    - {cmd: "curl -H 'Authorization: Bearer TOKEN' https://api.example.com/me", description: "Calls an authenticated API"}
  keywords: [http, https, api, health check, download, request]
  related: [linux-wget, linux-dig]

- id: linux-wget
  tool: linux
  category: network
  name: wget
  syntax: wget [OPTIONS] URL
  summary: Downloads files over HTTP, HTTPS, or FTP
  flags:
    - {flag: "-O FILE", description: "Save output to a specific file"}
    - {flag: "-q", description: "Quiet mode"}
    - {flag: "-c", description: "Resume an interrupted download"}
    - {flag: "-S", description: "Show server response headers"}
  examples:
    - {cmd: "wget -O app.tar.gz https://example.com/app.tar.gz", description: "Downloads an artifact to a specific filename"}
    - {cmd: "wget -c https://example.com/large.iso", description: "Resumes a partially downloaded file"}
  keywords: [download, file download, artifact, http, ftp]
  related: [linux-curl]

# ======================= LOGS =======================
- id: linux-journalctl
  tool: linux
  category: logs
  name: journalctl
  syntax: journalctl [-u UNIT] [-f] [--since TIME] [-p LEVEL]
  summary: Reads systemd logs
  flags:
    - {flag: "-u", description: "Filter by service"}
    - {flag: "-f", description: "Follow logs in real time"}
    - {flag: "--since / --until", description: "Time range"}
    - {flag: "-p err", description: "Errors or more severe messages only"}
    - {flag: "-b", description: "Current boot only"}
  examples:
    - {cmd: "journalctl -u nginx --since '1 hour ago' -p err", description: "Nginx errors from the last hour"}
    - {cmd: "journalctl -b -1 -p warning", description: "Warnings from the previous boot"}
    - {cmd: "journalctl -f -u docker", description: "Follows Docker service logs"}
  keywords: [service log, systemd log, view logs, errors, boot logs]
  related: [linux-systemctl, linux-dmesg, linux-tail]

- id: linux-dmesg
  tool: linux
  category: logs
  name: dmesg
  syntax: dmesg [-T] [-w] [-l LEVEL]
  summary: Shows messages from the kernel ring buffer
  flags:
    - {flag: "-T", description: "Show human-readable timestamps"}
    - {flag: "-w", description: "Wait for and follow new kernel messages"}
    - {flag: "-l", description: "Filter by log level"}
  examples:
    - {cmd: "dmesg -T | tail -50", description: "Shows the latest kernel messages"}
    - {cmd: "sudo dmesg -T -l err,warn", description: "Shows kernel warnings and errors"}
  keywords: [kernel log, boot messages, hardware error, driver error]
  related: [linux-journalctl, linux-tail]

- id: linux-tail
  tool: linux
  category: logs
  name: tail
  syntax: tail [-n N] [-f] FILE
  summary: Shows the end of a file and can follow new lines
  flags:
    - {flag: "-n", description: "Number of lines to show"}
    - {flag: "-f", description: "Follow the file as it grows"}
    - {flag: "-F", description: "Follow by filename and reopen after rotation"}
  examples:
    - {cmd: "tail -n 100 /var/log/syslog", description: "Shows the last 100 log lines"}
    - {cmd: "tail -F /var/log/nginx/access.log", description: "Follows a log across rotation"}
  keywords: [tail log, follow log, last lines, log rotation]
  related: [linux-head, linux-journalctl, linux-grep]

- id: linux-less
  tool: linux
  category: logs
  name: less
  syntax: less [OPTIONS] FILE
  summary: Views large text files interactively without loading everything at once
  flags:
    - {flag: "-N", description: "Show line numbers"}
    - {flag: "+F", description: "Follow the file like tail -f"}
    - {flag: "-S", description: "Do not wrap long lines"}
  examples:
    - {cmd: "less +F /var/log/syslog", description: "Follows a log interactively"}
    - {cmd: "less -N /var/log/nginx/error.log", description: "Views an error log with line numbers"}
  keywords: [view log, inspect file, large file, pager]
  related: [linux-tail, linux-grep]

# ======================= SERVICES =======================
- id: linux-systemctl
  tool: linux
  category: services
  name: systemctl
  syntax: systemctl start|stop|restart|status|enable|disable UNIT
  summary: Manages systemd services
  flags:
    - {flag: "enable --now", description: "Enable at boot and start immediately"}
    - {flag: "--failed", description: "Lists failed services (with list-units)"}
    - {flag: "daemon-reload", description: "Reloads unit files after a change"}
    - {flag: "is-active", description: "Checks whether a service is currently active"}
    - {flag: "is-enabled", description: "Checks whether a service is enabled at boot"}
  examples:
    - {cmd: "systemctl list-units --failed", description: "Lists failed services"}
    - {cmd: "sudo systemctl enable --now nginx", description: "Enables and starts nginx"}
    - {cmd: "sudo systemctl daemon-reload", description: "Reloads unit definitions after editing a service"}
  keywords: [start service, restart service, service status, daemon, service]
  related: [linux-journalctl]
  danger: caution

- id: linux-service
  tool: linux
  category: services
  name: service
  syntax: service SERVICE [start|stop|restart|status]
  summary: Controls services through the traditional SysV-compatible interface
  flags:
    - {flag: "status", description: "Shows service status"}
    - {flag: "start", description: "Starts the service"}
    - {flag: "stop", description: "Stops the service"}
    - {flag: "restart", description: "Restarts the service"}
  examples:
    - {cmd: "sudo service nginx status", description: "Checks nginx status"}
    - {cmd: "sudo service nginx restart", description: "Restarts nginx"}
  keywords: [service, start service, stop service, legacy service]
  related: [linux-systemctl]

# ======================= DISK =======================
- id: linux-df
  tool: linux
  category: disk
  name: df
  syntax: df [-h] [-i] [PATH]
  summary: Shows free space for filesystems
  flags:
    - {flag: "-h", description: "Human-readable sizes (GB, MB)"}
    - {flag: "-i", description: "Shows inodes (disk full despite free space)"}
    - {flag: "-T", description: "Shows filesystem type"}
  examples:
    - {cmd: "df -hT", description: "Shows space and filesystem type for every mount"}
    - {cmd: "df -ih", description: "Checks inode usage"}
  keywords: [disk space, disk full, free space, filesystem, inodes]
  related: [linux-du]

- id: linux-du
  tool: linux
  category: disk
  name: du
  syntax: du [-sh] [--max-depth=N] PATH
  summary: Calculates disk usage of files and directories
  flags:
    - {flag: "-s", description: "Total only"}
    - {flag: "-h", description: "Human-readable sizes"}
    - {flag: "--max-depth", description: "Detail depth"}
  examples:
    - {cmd: "sudo du -h --max-depth=1 /var | sort -rh | head", description: "Largest directories in /var"}
    - {cmd: "du -sh /var/lib/docker", description: "Total Docker data usage"}
  keywords: [large directories, what uses space, directory size, disk usage]
  related: [linux-df, linux-sort]

- id: linux-lsblk
  tool: linux
  category: disk
  name: lsblk
  syntax: lsblk [-f] [-o COLUMNS]
  summary: Lists block devices, partitions, filesystems, and mount points
  flags:
    - {flag: "-f", description: "Shows filesystem information"}
    - {flag: "-o", description: "Selects output columns"}
    - {flag: "-p", description: "Shows full device paths"}
  examples:
    - {cmd: "lsblk -f", description: "Shows disks, filesystems, UUIDs, and mount points"}
    - {cmd: "lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS", description: "Useful storage overview"}
  keywords: [disk, partition, block device, mount point, filesystem]
  related: [linux-df, linux-mount, linux-blkid]

- id: linux-blkid
  tool: linux
  category: disk
  name: blkid
  syntax: blkid [DEVICE]
  summary: Prints block device attributes such as UUID and filesystem type
  flags:
    - {flag: "-o", description: "Selects output format"}
    - {flag: "-s", description: "Shows only a selected tag"}
  examples:
    - {cmd: "sudo blkid", description: "Lists UUIDs and filesystem types for block devices"}
    - {cmd: "sudo blkid /dev/sdb1", description: "Inspects one partition"}
  keywords: [uuid, filesystem type, partition, disk identification]
  related: [linux-lsblk, linux-mount]

- id: linux-mount
  tool: linux
  category: disk
  name: mount
  syntax: mount [-t TYPE] DEVICE DIR
  summary: Mounts a filesystem at a directory
  flags:
    - {flag: "-t", description: "Specifies the filesystem type"}
    - {flag: "-a", description: "Mounts all filesystems from /etc/fstab"}
    - {flag: "-o", description: "Specifies mount options"}
  examples:
    - {cmd: "sudo mount /dev/sdb1 /mnt/data", description: "Mounts a partition at /mnt/data"}
    - {cmd: "mount | grep /mnt/data", description: "Checks whether /mnt/data is mounted"}
  keywords: [mount disk, filesystem mount, fstab, attach volume]
  related: [linux-umount, linux-lsblk, linux-blkid]
  danger: caution

- id: linux-umount
  tool: linux
  category: disk
  name: umount
  syntax: umount [-l] MOUNTPOINT|DEVICE
  summary: Unmounts a filesystem
  flags:
    - {flag: "-l", description: "Lazy unmount when the filesystem is busy"}
    - {flag: "-f", description: "Force unmount where supported"}
  examples:
    - {cmd: "sudo umount /mnt/data", description: "Unmounts a filesystem"}
    - {cmd: "sudo lsof +D /mnt/data", description: "Finds processes preventing an unmount"}
  keywords: [unmount, detach disk, busy filesystem, mount]
  related: [linux-mount, linux-lsof]
  danger: caution

- id: linux-fdisk
  tool: linux
  category: disk
  name: fdisk
  syntax: fdisk [-l] [DEVICE]
  summary: Inspects and manages disk partition tables
  flags:
    - {flag: "-l", description: "Lists partition tables"}
    - {flag: "DEVICE", description: "Disk device to inspect or modify"}
  examples:
    - {cmd: "sudo fdisk -l", description: "Lists disks and partitions"}
  keywords: [partition, partition table, disk layout, mbr, gpt]
  related: [linux-lsblk, linux-parted]
  danger: destructive

# ======================= FILES =======================
- id: linux-find
  tool: linux
  category: files
  name: find
  syntax: find PATH [-name PAT] [-type f|d] [-mtime N] [-size N] [-exec CMD {} +]
  summary: Searches for files by name, type, date, or size
  flags:
    - {flag: "-name / -iname", description: "Name (iname ignores case)"}
    - {flag: "-mtime", description: "Modified N days ago (+N means older)"}
    - {flag: "-size", description: "Size, e.g. +100M"}
    - {flag: "-exec", description: "Executes a command on results"}
    - {flag: "-delete", description: "Deletes matching files"}
  examples:
    - {cmd: "find /var/log -name '*.log' -mtime +30 -size +50M", description: "Old and large log files"}
    - {cmd: "find /tmp -type f -mtime +7 -delete", description: "Deletes files older than seven days in /tmp"}
  keywords: [find file, search file, file search, old files, large files]
  related: [linux-locate, linux-xargs]
  danger: caution

- id: linux-locate
  tool: linux
  category: files
  name: locate
  syntax: locate [PATTERN]
  summary: Quickly searches a prebuilt file-name database
  flags:
    - {flag: "-i", description: "Case-insensitive search"}
    - {flag: "-r", description: "Search using a regular expression"}
  examples:
    - {cmd: "locate nginx.conf", description: "Finds paths matching nginx.conf"}
    - {cmd: "locate -i docker-compose.yml", description: "Case-insensitive filename search"}
  keywords: [find file, locate file, filename search, fast search]
  related: [linux-find, linux-updatedb]

- id: linux-grep
  tool: linux
  category: files
  name: grep
  syntax: grep [-rinE] PATTERN [FILE...]
  summary: Searches text using patterns and regular expressions
  flags:
    - {flag: "-r, --recursive", description: "Searches directories recursively"}
    - {flag: "-i", description: "Ignores case"}
    - {flag: "-n", description: "Shows line numbers"}
    - {flag: "-E", description: "Uses extended regular expressions"}
    - {flag: "-v", description: "Shows non-matching lines"}
  examples:
    - {cmd: "grep -Rni 'error' /var/log", description: "Searches error messages recursively"}
    - {cmd: "grep -nE 'ERROR|WARN' app.log", description: "Finds ERROR or WARN lines"}
  keywords: [search text, regex, logs, find string, search files]
  related: [linux-ripgrep, linux-find, linux-awk]

- id: linux-ripgrep
  tool: linux
  category: files
  name: rg
  syntax: rg [OPTIONS] PATTERN [PATH]
  summary: Fast recursive text search that respects ignore files
  flags:
    - {flag: "-n", description: "Shows line numbers"}
    - {flag: "-i", description: "Ignores case"}
    - {flag: "-g", description: "Filters files by glob"}
    - {flag: "--hidden", description: "Includes hidden files"}
  examples:
    - {cmd: "rg -n 'TODO|FIXME' .", description: "Finds TODO and FIXME markers in the project"}
    - {cmd: "rg -n -g '*.yaml' 'image:' .", description: "Searches image declarations in YAML files"}
  keywords: [fast grep, search code, regex, recursive search]
  related: [linux-grep, linux-find]

- id: linux-xargs
  tool: linux
  category: files
  name: xargs
  syntax: xargs [OPTIONS] COMMAND
  summary: Builds command lines from standard input
  flags:
    - {flag: "-0", description: "Reads NUL-separated input"}
    - {flag: "-n", description: "Uses a maximum number of arguments per command"}
    - {flag: "-P", description: "Runs multiple commands in parallel"}
  examples:
    - {cmd: "find . -name '*.log' -print0 | xargs -0 rm", description: "Removes matching log files safely with spaces in names"}
    - {cmd: "printf '%s\\n' a b c | xargs -n1 echo", description: "Runs a command once per input item"}
  keywords: [pipe arguments, batch command, parallel command, stdin]
  related: [linux-find, linux-exec]

- id: linux-tar
  tool: linux
  category: files
  name: tar
  syntax: tar [-c|-x|-t] [-z|-j|-J] [-f FILE] [PATH...]
  summary: Creates, lists, and extracts tar archives
  flags:
    - {flag: "-c", description: "Creates an archive"}
    - {flag: "-x", description: "Extracts an archive"}
    - {flag: "-t", description: "Lists archive contents"}
    - {flag: "-z", description: "Uses gzip compression"}
    - {flag: "-f", description: "Specifies the archive file"}
  examples:
    - {cmd: "tar -czf backup.tar.gz /etc/myapp", description: "Creates a gzip-compressed archive"}
    - {cmd: "tar -xzf backup.tar.gz -C /tmp/restore", description: "Extracts an archive into a directory"}
    - {cmd: "tar -tzf backup.tar.gz", description: "Lists archive contents without extracting"}
  keywords: [tar, archive, backup, extract, gzip, compress]
  related: [linux-gzip, linux-rsync]

- id: linux-rsync
  tool: linux
  category: files
  name: rsync
  syntax: rsync [-avh] [--delete] SRC DEST
  summary: Efficiently synchronizes files and directories
  flags:
    - {flag: "-a", description: "Archive mode, preserves common metadata"}
    - {flag: "-v", description: "Verbose output"}
    - {flag: "-h", description: "Human-readable sizes"}
    - {flag: "--delete", description: "Deletes destination files missing from source"}
    - {flag: "--dry-run", description: "Shows what would be changed"}
  examples:
    - {cmd: "rsync -avh ./app/ server:/srv/app/", description: "Synchronizes an application directory to a remote host"}
    - {cmd: "rsync -avhn --delete ./data/ /backup/data/", description: "Previews a mirror synchronization"}
  keywords: [sync files, copy files, backup, remote sync, mirror]
  related: [linux-ssh, linux-scp]
  danger: caution

- id: linux-chmod
  tool: linux
  category: files
  name: chmod
  syntax: chmod [-R] MODE FILE...
  summary: Changes file and directory permissions
  flags:
    - {flag: "-R", description: "Applies recursively"}
    - {flag: "u/g/o", description: "Targets user, group, or others"}
    - {flag: "+/-/=", description: "Adds, removes, or sets permissions"}
  examples:
    - {cmd: "chmod 640 app.env", description: "Sets owner read/write and group read permissions"}
    - {cmd: "chmod +x deploy.sh", description: "Makes a script executable"}
    - {cmd: "chmod -R u=rwX,g=rX,o= /srv/app", description: "Sets controlled recursive permissions"}
  keywords: [permissions, executable, file mode, access rights]
  related: [linux-chown, linux-umask]

- id: linux-chown
  tool: linux
  category: files
  name: chown
  syntax: chown [-R] USER[:GROUP] FILE...
  summary: Changes file and directory ownership
  flags:
    - {flag: "-R", description: "Applies recursively"}
    - {flag: "USER:GROUP", description: "Sets owner and group"}
    - {flag: "--reference", description: "Copies ownership from another file"}
  examples:
    - {cmd: "sudo chown app:app /srv/app/app.conf", description: "Sets the application user and group"}
    - {cmd: "sudo chown -R www-data:www-data /var/www/app", description: "Changes ownership recursively"}
  keywords: [file owner, group owner, permissions, ownership]
  related: [linux-chmod, linux-stat]
  danger: caution

- id: linux-ln
  tool: linux
  category: files
  name: ln
  syntax: ln [-s] TARGET LINK_NAME
  summary: Creates hard or symbolic links
  flags:
    - {flag: "-s", description: "Creates a symbolic link"}
    - {flag: "-f", description: "Replaces an existing destination where supported"}
    - {flag: "-n", description: "Treats a destination symlink as a normal file"}
  examples:
    - {cmd: "ln -s /opt/app/releases/current /srv/app", description: "Creates a symlink to the current release"}
    - {cmd: "ln -s /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app", description: "Enables an nginx site using a symlink"}
  keywords: [symlink, symbolic link, hard link, current release]
  related: [linux-readlink, linux-cp]

# ======================= PROCESSES =======================
- id: linux-ps
  tool: linux
  category: processes
  name: ps
  syntax: ps aux | ps -ef
  summary: Lists running processes
  flags:
    - {flag: "aux", description: "BSD-style process listing with resource usage"}
    - {flag: "-ef", description: "Full process listing in standard format"}
    - {flag: "--forest", description: "Shows parent-child process relationships"}
  examples:
    - {cmd: "ps aux --sort=-%mem | head", description: "Processes using the most memory"}
    - {cmd: "ps -ef --forest", description: "Shows the process tree"}
  keywords: [process list, running process, pid, process tree]
  related: [linux-top, linux-pgrep, linux-kill]

- id: linux-top
  tool: linux
  category: processes
  name: top
  syntax: top [-p PID]
  summary: Monitors processes and system resource usage interactively
  flags:
    - {flag: "-p", description: "Monitors specific PIDs"}
    - {flag: "-b", description: "Batch mode for scripts or capture"}
    - {flag: "-n", description: "Number of refresh iterations"}
  examples:
    - {cmd: "top", description: "Interactive CPU and memory monitoring"}
    - {cmd: "top -b -n 1 | head -30", description: "Captures a one-shot process snapshot"}
  keywords: [cpu usage, memory usage, process monitor, load]
  related: [linux-ps, linux-free, linux-vmstat]

- id: linux-pgrep
  tool: linux
  category: processes
  name: pgrep
  syntax: pgrep [-a] [-f] PATTERN
  summary: Finds process IDs matching a name or pattern
  flags:
    - {flag: "-a", description: "Shows the full command line"}
    - {flag: "-f", description: "Matches against the full command line"}
    - {flag: "-u", description: "Filters by user"}
  examples:
    - {cmd: "pgrep -af 'java.*app.jar'", description: "Finds Java processes running the application"}
    - {cmd: "pgrep -u deploy nginx", description: "Finds nginx processes owned by deploy"}
  keywords: [find process, pid, process id, running command]
  related: [linux-ps, linux-pkill, linux-kill]

- id: linux-pkill
  tool: linux
  category: processes
  name: pkill
  syntax: pkill [-SIGNAL] [-f] PATTERN
  summary: Sends a signal to processes matching a pattern
  flags:
    - {flag: "-TERM", description: "Requests graceful termination"}
    - {flag: "-KILL", description: "Forces immediate termination"}
    - {flag: "-f", description: "Matches against the full command line"}
  examples:
    - {cmd: "pkill -TERM -f 'worker.py'", description: "Gracefully stops matching workers"}
    - {cmd: "pkill -KILL -f 'stuck-worker'", description: "Force-stops a stuck process"}
  keywords: [kill process, stop process, signal, terminate process]
  related: [linux-pgrep, linux-kill]
  danger: caution

- id: linux-kill
  tool: linux
  category: processes
  name: kill
  syntax: kill [-SIGNAL] PID...
  summary: Sends a signal to one or more processes
  flags:
    - {flag: "-TERM", description: "Requests graceful termination"}
    - {flag: "-KILL", description: "Forces immediate termination"}
    - {flag: "-HUP", description: "Commonly used to request configuration reloads"}
    - {flag: "-0", description: "Checks whether a process exists without sending a signal"}
  examples:
    - {cmd: "kill -TERM 1234", description: "Requests graceful shutdown of PID 1234"}
    - {cmd: "kill -0 1234", description: "Checks whether PID 1234 exists and is accessible"}
  keywords: [send signal, terminate process, pid, graceful shutdown]
  related: [linux-ps, linux-pgrep, linux-pkill]
  danger: caution

- id: linux-free
  tool: linux
  category: processes
  name: free
  syntax: free [-h] [-m] [-g]
  summary: Shows RAM and swap usage
  flags:
    - {flag: "-h", description: "Human-readable output"}
    - {flag: "-m", description: "Show values in MiB"}
    - {flag: "-g", description: "Show values in GiB"}
  examples:
    - {cmd: "free -h", description: "Shows total, used, free, and available memory"}
  keywords: [ram, memory, swap, out of memory]
  related: [linux-top, linux-vmstat]

- id: linux-vmstat
  tool: linux
  category: processes
  name: vmstat
  syntax: vmstat [-w] [INTERVAL [COUNT]]
  summary: Reports memory, process, CPU, and I/O statistics
  flags:
    - {flag: "-w", description: "Wide output"}
    - {flag: "INTERVAL", description: "Refresh interval in seconds"}
    - {flag: "COUNT", description: "Number of reports"}
  examples:
    - {cmd: "vmstat 1 10", description: "Collects ten one-second system snapshots"}
  keywords: [system metrics, cpu, memory, io, load]
  related: [linux-top, linux-free, linux-iostat]

# ======================= CPU / PERFORMANCE =======================
- id: linux-iostat
  tool: linux
  category: performance
  name: iostat
  syntax: iostat [-xz] [INTERVAL [COUNT]]
  summary: Reports CPU and disk I/O statistics
  flags:
    - {flag: "-x", description: "Extended device statistics"}
    - {flag: "-z", description: "Omits devices with no activity"}
    - {flag: "-d", description: "Device statistics only"}
  examples:
    - {cmd: "iostat -xz 1 5", description: "Collects detailed disk I/O statistics"}
  keywords: [disk io, io wait, cpu, performance, latency]
  related: [linux-vmstat, linux-iotop]

- id: linux-iotop
  tool: linux
  category: performance
  name: iotop
  syntax: iotop [-o] [-P] [-a]
  summary: Shows processes responsible for disk I/O
  flags:
    - {flag: "-o", description: "Shows only processes performing I/O"}
    - {flag: "-P", description: "Shows I/O by process instead of thread"}
    - {flag: "-a", description: "Shows accumulated I/O"}
  examples:
    - {cmd: "sudo iotop -oPa", description: "Shows active disk I/O by process"}
  keywords: [disk io, process io, disk bottleneck, performance]
  related: [linux-iostat, linux-ps]

- id: linux-nice
  tool: linux
  category: performance
  name: nice
  syntax: nice [-n ADJUSTMENT] COMMAND
  summary: Runs a command with an adjusted CPU scheduling priority
  flags:
    - {flag: "-n", description: "Adds a nice value to the default priority"}
  examples:
    - {cmd: "nice -n 10 ./backup.sh", description: "Runs a backup with lower CPU scheduling priority"}
  keywords: [cpu priority, scheduling, background workload, nice]
  related: [linux-renice]

- id: linux-renice
  tool: linux
  category: performance
  name: renice
  syntax: renice [-n VALUE] [-p PID...]
  summary: Changes the scheduling priority of running processes
  flags:
    - {flag: "-n", description: "Sets the new nice value"}
    - {flag: "-p", description: "Targets process IDs"}
    - {flag: "-u", description: "Targets processes owned by a user"}
  examples:
    - {cmd: "sudo renice -n 10 -p 1234", description: "Lowers the scheduling priority of a running process"}
  keywords: [change priority, cpu priority, process scheduling]
  related: [linux-nice, linux-top]
  danger: caution

