# ======================= CONTAINERS / DEVOPS =======================
- id: linux-nsenter
  tool: linux
  category: containers
  name: nsenter
  syntax: nsenter -t PID -m|-u|-i|-n|-p COMMAND
  summary: Runs a command inside selected Linux namespaces of another process
  flags:
    - {flag: "-t", description: "Target process ID"}
    - {flag: "-m", description: "Enter the target mount namespace"}
    - {flag: "-n", description: "Enter the target network namespace"}
    - {flag: "-p", description: "Enter the target PID namespace"}
  examples:
    - {cmd: "sudo nsenter -t 1234 -n ip addr", description: "Inspects the target process network namespace"}
    - {cmd: "sudo nsenter -t 1234 -m -u -i -n -p sh", description: "Opens a shell across selected namespaces"}
  keywords: [container namespace, network namespace, debug container, linux namespace]
  related: [linux-ip, linux-pidof]
  danger: caution

- id: linux-unshare
  tool: linux
  category: containers
  name: unshare
  syntax: unshare [OPTIONS] COMMAND
  summary: Runs a command with selected Linux namespaces unshared
  flags:
    - {flag: "-n", description: "Unshares the network namespace"}
    - {flag: "-m", description: "Unshares the mount namespace"}
    - {flag: "-p", description: "Unshares the PID namespace"}
    - {flag: "-r", description: "Maps the current user to root in the new user namespace"}
  examples:
    - {cmd: "unshare -Urnm sh", description: "Starts a shell with user, mount, and network namespaces"}
  keywords: [namespace, container, isolation, linux namespace]
  related: [linux-nsenter]
  danger: caution

# ======================= MISC DEVOPS =======================
- id: linux-time
  tool: linux
  category: performance
  name: time
  syntax: time COMMAND
  summary: Measures command execution time and resource usage
  flags:
    - {flag: "-p", description: "Portable timing format"}
  examples:
    - {cmd: "time ./deploy.sh", description: "Measures deployment execution time"}
    - {cmd: "time curl -fsS https://example.com/health", description: "Measures an HTTP health check"}
  keywords: [execution time, benchmark, command duration, performance]
  related: [linux-timeout]

- id: linux-timeout
  tool: linux
  category: processes
  name: timeout
  syntax: timeout [OPTIONS] DURATION COMMAND
  summary: Runs a command with a maximum execution time
  flags:
    - {flag: "--signal", description: "Signal to send when the timeout expires"}
    - {flag: "--kill-after", description: "Forces termination after an additional grace period"}
  examples:
    - {cmd: "timeout 30s ./health-check.sh", description: "Stops a health check after 30 seconds"}
    - {cmd: "timeout --signal=TERM 2m ./deploy.sh", description: "Gives a deployment at most two minutes"}
  keywords: [command timeout, prevent hang, ci timeout, automation]
  related: [linux-kill, linux-time]

- id: linux-watch
  tool: linux
  category: monitoring
  name: watch
  syntax: watch [-n SECONDS] COMMAND
  summary: Repeats a command periodically and refreshes its output
  flags:
    - {flag: "-n", description: "Refresh interval in seconds"}
    - {flag: "-d", description: "Highlights differences between updates"}
  examples:
    - {cmd: "watch -n 2 'ss -ltnp'", description: "Monitors listening TCP sockets every two seconds"}
    - {cmd: "watch -d 'df -h /'", description: "Watches root filesystem usage and highlights changes"}
  keywords: [watch command, live monitoring, refresh output, filesystem monitoring]
  related: [linux-ss, linux-df, linux-top]

