# ======================= TEXT / SHELL =======================
- id: linux-awk
  tool: linux
  category: shell
  name: awk
  syntax: awk 'PROGRAM' [FILE...]
  summary: Processes and transforms structured text line by line
  flags:
    - {flag: "-F", description: "Sets the input field separator"}
    - {flag: "-v", description: "Defines a variable before processing"}
  examples:
    - {cmd: "awk '{print $1}' access.log", description: "Prints the first whitespace-separated field"}
    - {cmd: "awk -F: '{print $1}' /etc/passwd", description: "Prints usernames from /etc/passwd"}
  keywords: [text processing, fields, csv, parsing, shell scripting]
  related: [linux-sed, linux-cut, linux-sort]

- id: linux-sed
  tool: linux
  category: shell
  name: sed
  syntax: sed [OPTIONS] 'SCRIPT' [FILE...]
  summary: Performs stream-based text transformations
  flags:
    - {flag: "-n", description: "Suppresses automatic printing"}
    - {flag: "-E", description: "Uses extended regular expressions"}
    - {flag: "-i", description: "Edits files in place"}
  examples:
    - {cmd: "sed -n '1,20p' app.log", description: "Prints lines 1 through 20"}
    - {cmd: "sed -E 's/[0-9]+/N/g' input.txt", description: "Replaces numeric sequences with N"}
  keywords: [replace text, edit file, regex, stream editor]
  related: [linux-awk, linux-grep]

- id: linux-cut
  tool: linux
  category: shell
  name: cut
  syntax: cut [-d DELIM] [-f LIST] [FILE]
  summary: Extracts selected columns or character ranges from text
  flags:
    - {flag: "-d", description: "Sets the field delimiter"}
    - {flag: "-f", description: "Selects fields"}
    - {flag: "-c", description: "Selects character positions"}
  examples:
    - {cmd: "cut -d: -f1 /etc/passwd", description: "Extracts usernames"}
    - {cmd: "cut -d, -f1,3 data.csv", description: "Extracts CSV columns 1 and 3"}
  keywords: [columns, fields, csv, text extraction]
  related: [linux-awk, linux-sort]

- id: linux-sort
  tool: linux
  category: shell
  name: sort
  syntax: sort [-n|-h|-r] [FILE]
  summary: Sorts lines of text
  flags:
    - {flag: "-n", description: "Numeric sort"}
    - {flag: "-h", description: "Human-readable numeric sort"}
    - {flag: "-r", description: "Reverse order"}
    - {flag: "-u", description: "Unique lines only"}
  examples:
    - {cmd: "du -h --max-depth=1 /var | sort -rh", description: "Sorts directories by human-readable size"}
    - {cmd: "sort -u users.txt", description: "Sorts and removes duplicate lines"}
  keywords: [sort text, numeric sort, largest files, unique lines]
  related: [linux-uniq, linux-awk]

- id: linux-uniq
  tool: linux
  category: shell
  name: uniq
  syntax: uniq [-c|-d|-u] [FILE]
  summary: Filters or counts adjacent duplicate lines
  flags:
    - {flag: "-c", description: "Counts occurrences"}
    - {flag: "-d", description: "Shows duplicated lines only"}
    - {flag: "-u", description: "Shows unique lines only"}
  examples:
    - {cmd: "sort access.log | uniq -c | sort -nr | head", description: "Finds the most frequent log lines"}
  keywords: [duplicates, count lines, frequency, text statistics]
  related: [linux-sort, linux-awk]

- id: linux-wc
  tool: linux
  category: shell
  name: wc
  syntax: wc [-l|-w|-c] [FILE]
  summary: Counts lines, words, and bytes
  flags:
    - {flag: "-l", description: "Counts lines"}
    - {flag: "-w", description: "Counts words"}
    - {flag: "-c", description: "Counts bytes"}
  examples:
    - {cmd: "wc -l /var/log/app.log", description: "Counts log lines"}
    - {cmd: "find . -type f | wc -l", description: "Counts files recursively"}
  keywords: [count lines, count files, word count, statistics]
  related: [linux-find, linux-grep]

- id: linux-head
  tool: linux
  category: shell
  name: head
  syntax: head [-n N] [FILE]
  summary: Shows the beginning of a file or command output
  flags:
    - {flag: "-n", description: "Number of lines to show"}
    - {flag: "-c", description: "Number of bytes to show"}
  examples:
    - {cmd: "head -n 20 app.log", description: "Shows the first 20 lines"}
    - {cmd: "ps aux | head", description: "Shows the first process entries"}
  keywords: [first lines, preview file, command output]
  related: [linux-tail, linux-less]

# ======================= ARCHIVE / COMPRESSION =======================
- id: linux-gzip
  tool: linux
  category: archive
  name: gzip
  syntax: gzip [-d] [-k] FILE...
  summary: Compresses or decompresses files using gzip
  flags:
    - {flag: "-d", description: "Decompresses"}
    - {flag: "-k", description: "Keeps the original file"}
    - {flag: "-c", description: "Writes compressed data to standard output"}
  examples:
    - {cmd: "gzip -k access.log", description: "Compresses a log while keeping the original"}
    - {cmd: "gzip -d backup.gz", description: "Decompresses a gzip file"}
  keywords: [gzip, compress, decompress, log compression]
  related: [linux-gunzip, linux-tar]

- id: linux-zgrep
  tool: linux
  category: archive
  name: zgrep
  syntax: zgrep [OPTIONS] PATTERN FILE.gz
  summary: Searches text directly inside gzip-compressed files
  flags:
    - {flag: "-i", description: "Ignores case"}
    - {flag: "-n", description: "Shows line numbers"}
    - {flag: "-E", description: "Uses extended regular expressions"}
  examples:
    - {cmd: "zgrep -n 'ERROR' /var/log/app.log.2.gz", description: "Searches errors inside a compressed log"}
  keywords: [compressed logs, search gzip, zgrep, log analysis]
  related: [linux-grep, linux-gzip]

# ======================= SSH / REMOTE =======================
- id: linux-ssh
  tool: linux
  category: remote
  name: ssh
  syntax: ssh [-p PORT] [-i KEY] [USER@]HOST [COMMAND]
  summary: Connects to a remote host over SSH
  flags:
    - {flag: "-p", description: "Remote SSH port"}
    - {flag: "-i", description: "Identity/private key file"}
    - {flag: "-L", description: "Local port forwarding"}
    - {flag: "-R", description: "Remote port forwarding"}
    - {flag: "-N", description: "Do not execute a remote command"}
  examples:
    - {cmd: "ssh deploy@server.example.com", description: "Opens an interactive SSH session"}
    - {cmd: "ssh -L 8080:localhost:8080 user@server", description: "Forwards a local port to a remote service"}
    - {cmd: "ssh user@server 'systemctl status nginx --no-pager'", description: "Runs a remote command"}
  keywords: [ssh, remote shell, port forwarding, server access]
  related: [linux-scp, linux-rsync]

- id: linux-scp
  tool: linux
  category: remote
  name: scp
  syntax: scp [-P PORT] [-i KEY] SRC [USER@]HOST:DEST
  summary: Copies files between local and remote hosts over SSH
  flags:
    - {flag: "-P", description: "Remote SSH port"}
    - {flag: "-i", description: "Identity/private key file"}
    - {flag: "-r", description: "Copies directories recursively"}
  examples:
    - {cmd: "scp app.tar.gz deploy@server:/tmp/", description: "Uploads an archive to a remote host"}
    - {cmd: "scp deploy@server:/var/log/app.log ./", description: "Downloads a remote log"}
  keywords: [copy remote file, upload, download, ssh, scp]
  related: [linux-ssh, linux-rsync]

# ======================= USERS / PERMISSIONS =======================
- id: linux-id
  tool: linux
  category: users
  name: id
  syntax: id [USER]
  summary: Shows user and group IDs
  flags:
    - {flag: "-u", description: "Shows user ID only"}
    - {flag: "-g", description: "Shows primary group ID only"}
    - {flag: "-G", description: "Shows all group IDs"}
    - {flag: "-n", description: "Shows names instead of numeric IDs"}
  examples:
    - {cmd: "id", description: "Shows the current user's UID, GID, and groups"}
    - {cmd: "id deploy", description: "Shows identity and groups for deploy"}
  keywords: [uid, gid, groups, user identity, permissions]
  related: [linux-whoami, linux-groups]

- id: linux-whoami
  tool: linux
  category: users
  name: whoami
  syntax: whoami
  summary: Prints the effective current username
  flags: []
  examples:
    - {cmd: "whoami", description: "Shows which user is running the command"}
    - {cmd: "sudo whoami", description: "Confirms the effective user under sudo"}
  keywords: [current user, username, effective user, sudo]
  related: [linux-id, linux-groups]

- id: linux-groups
  tool: linux
  category: users
  name: groups
  syntax: groups [USER]
  summary: Shows the groups a user belongs to
  flags: []
  examples:
    - {cmd: "groups deploy", description: "Shows groups for the deploy user"}
  keywords: [user groups, permissions, membership]
  related: [linux-id, linux-usermod]

- id: linux-useradd
  tool: linux
  category: users
  name: useradd
  syntax: useradd [OPTIONS] USER
  summary: Creates a local user account
  flags:
    - {flag: "-m", description: "Creates the home directory"}
    - {flag: "-s", description: "Sets the login shell"}
    - {flag: "-G", description: "Adds the user to supplementary groups"}
  examples:
    - {cmd: "sudo useradd -m -s /bin/bash deploy", description: "Creates a deploy user with a home directory"}
  keywords: [create user, linux user, account, deploy user]
