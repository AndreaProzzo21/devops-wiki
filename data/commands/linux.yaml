  related: [linux-useradd, linux-groups]
  danger: caution

- id: linux-passwd
  tool: linux
  category: users
  name: passwd
  syntax: passwd [USER]
  summary: Changes a user's password
  flags:
    - {flag: "-l / -u", description: "Locks / unlocks the password"}
